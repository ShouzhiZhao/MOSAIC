name: Public source checks

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-py312.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints-py312.txt '.[dev]'
      - name: Check public source
        run: |
          python -m ruff check mosaic baselines setup.py
          python -m compileall -q mosaic baselines
          python -m pip check
      - name: Build and install release
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Run installed CPU example
        working-directory: ${{ runner.temp }}
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: mosaic demo --output-dir mosaic-cpu-demo
