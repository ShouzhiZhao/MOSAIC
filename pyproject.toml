[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-caso"
version = "0.3.0"
description = "MOSAIC behavioral simulation and content-aware seed optimization"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "ShouzhiZhao"}]
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.urls]
Repository = "https://github.com/ShouzhiZhao/MOSAIC"
Issues = "https://github.com/ShouzhiZhao/MOSAIC/issues"

[project.optional-dependencies]
encoder = ["sentence-transformers>=3.0"]
promosim = [
  "dill>=0.3.8",
  "faiss-cpu>=1.8",
  "langchain==0.0.352",
  "langchain-experimental==0.0.47",
  "openai>=1.0,<2",
  "pydantic<2",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "sentence-transformers>=3.0",
  "tqdm>=4.66",
  "transformers>=4.44",
  "yacs>=0.1.8",
]
dev = ["build>=1.2,<1.6", "pytest>=8,<9", "ruff>=0.9"]
interactive = ["opencv-python>=4.8"]

[project.scripts]
mosaic = "mosaic.cli:main"

[tool.setuptools.packages.find]
include = ["mosaic*", "baselines*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"mosaic.promosim" = ["config/*.yaml", "third_party/*"]
"baselines" = ["third_party/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
